kind = "web"
previewPath = "/"
title = "Marrakech Culture Experience"
description = "An interactive cultural guide to Marrakech with learning chapters, live presentation controls, audience participation, quizzes, and presenter results."
version = "1.0.0"
id = "artifacts/marrakech"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21787

[services.development]
run = "pnpm --filter @workspace/marrakech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marrakech", "run", "build" ]
serve = "static"
publicDir = "artifacts/marrakech/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21787"
BASE_PATH = "/"
